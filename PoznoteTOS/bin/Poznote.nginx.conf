location ~ ^/Poznote/(.*) {
    # Static resources are directly allowed (no authentication required)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2|webp)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    auth_request /auth-Poznote/$1$is_args$args;
    # If authentication fails, read the `X-Auth-Url` header returned by the auth service and redirect
    auth_request_set $auth_redirect $upstream_http_x_auth_url;
    error_page 401 = @redirect_to_auth;
    # Add PHP parsing
    location ~ \.php(.*)$ {
        keepalive_timeout 75;
        # Long operations (docker pull) run synchronously; do not cut them at 60s.
        fastcgi_read_timeout 3600;
        fastcgi_send_timeout 3600;
        fastcgi_pass   unix_php_cgi_sock;
        fastcgi_index  index.php;
        fastcgi_split_path_info  ^(.+\.php)(/.*)$;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO  $fastcgi_path_info;
        fastcgi_param  PATH_TRANSLATED  $document_root$fastcgi_path_info;
        include        fastcgi_params;
        fastcgi_param  HTTPS  $https if_not_empty;
    }

    # Continue processing the request after successful authentication
    try_files $uri $uri/ =404;
}

# Authentication service
location ~ ^/auth-Poznote/(.*) {
    internal;
    # First authenticate at 127.0.0.1:5057/validate
    proxy_pass http://127.0.0.1:5057/validate/$1$is_args$args;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Original-Host $host;
    proxy_set_header X-Original-Port $server_port;
    proxy_set_header X-Original-Request $request;
    proxy_set_header X-Original-AppId Poznote;
}

# Dynamic redirect when authentication fails
location @redirect_to_auth {
    # 302 redirect to the route specified by X-Auth-Url
    if ($auth_redirect) {
        return 302 $auth_redirect;
    }
    # Default redirect to tos desktop
    return 302 $scheme://$http_host;
}
